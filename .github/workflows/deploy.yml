```yaml
name: React CI/CD with AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

env:
  IMAGE_NAME: cicdi-app

jobs:

  # ==========================================
  # CI + BUILD DOCKER IMAGE + PUSH TO DOCKER HUB
  # ==========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 4. Install React dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Build React application
      - name: Build React Application
        run: npm run build

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 7. Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest


  # ==========================================
  # CD - DEPLOY TO AWS EC2
  # ==========================================
  deploy-ec2:
    name: Deploy React App to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      # 8. Connect to EC2 using SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "================================"
            echo "Starting EC2 Deployment"
            echo "================================"

            # Login to Docker Hub
            echo "Logging in to Docker Hub..."

            echo "${{ secrets.DOCKER_PASSWORD }}" | \
            docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

            # Pull latest Docker image
            echo "Pulling latest Docker image..."

            docker pull \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Stop old container
            echo "Stopping old container..."

            docker stop portfolio || true

            # Remove old container
            echo "Removing old container..."

            docker rm portfolio || true

            # Start new container
            echo "Starting new React container..."

            docker run -d \
              --name portfolio \
              -p 80:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Show running containers
            echo "================================"
            echo "Deployment completed!"
            echo "================================"

            docker ps
```
